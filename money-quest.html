<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Quest — One Month, One Big Question</title>
<style>
:root{--card:#fff;--line:#dde6ef;--ink:#14243a;--mut:#64758b;--green:#087f68;--green2:#0d9b7d;--mint:#e7f7f2;--gold:#d69b18;--amber:#fff6dc;--red:#c24154;--rose:#ffe9ec;--blue:#2f67b1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#f7faff 0%,#e9f1f8 60%,#f4f8fc 100%);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
.wrap{max-width:660px;margin:0 auto;padding:16px 16px 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;font-size:26px;letter-spacing:-.9px;line-height:1}
.brand .logo{background:linear-gradient(110deg,#0c2b4b,#087f68);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{flex:1;height:5px;border-radius:5px;background:#dde7f0;transition:background .4s}
.steps div.on{background:var(--green)}
/* card */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(30,55,84,.08);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#075b4b;background:#d8f3eb;padding:4px 11px;border-radius:999px;margin-bottom:10px}
.tag.gold{background:#fff0c7;color:#7c5200}.tag.red{background:var(--rose);color:#8e1b30}
h2{font-size:24px;letter-spacing:-.7px;line-height:1.18;margin-bottom:7px}
.txt{font-size:15px;color:#40536a;line-height:1.6;margin-bottom:14px}
.txt b{color:var(--ink)}
.intro{display:flex;gap:11px;align-items:flex-end;margin:2px 0 14px}
.intro .fig{width:84px;flex:none;max-width:84px}
.bubble{position:relative;flex:1;background:#f1f6fa;border:1px solid #e1e9f1;border-radius:16px;padding:11px 14px;font-size:14.5px;color:#334a62}
.bubble b{color:var(--ink)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-weight:900;font-size:16px;border-radius:15px;padding:14px 16px;margin-top:14px;box-shadow:0 4px 0 #05614f,0 12px 22px rgba(8,127,104,.18);transition:transform .1s,box-shadow .1s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #05614f}
.btn.ghost{background:#edf3f8;color:#263e57;box-shadow:none;font-size:14px;padding:12px}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:#f8fafc;border:1.5px solid var(--line);border-radius:13px;padding:11px 8px;font-weight:800;font-size:14.5px;color:#243c56;transition:.15s;text-align:center}
.opts button small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px}
.opts button.on{border-color:var(--green);background:var(--mint);color:var(--green);box-shadow:0 0 0 2px rgba(8,127,104,.08)}
/* slider */
.ask{background:#f7fbff;border:1.5px solid #d7e6f5;border-radius:16px;padding:13px 15px;margin:0 0 12px}
.ask .q1{font-size:14.5px;font-weight:800;margin-bottom:2px}
.ask .h1{font-size:12px;color:var(--mut);margin-bottom:9px}
.amt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.amt b{font-size:27px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.amt .of{font-size:12px;color:var(--mut);font-weight:700;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;display:block;margin:0}
input[type=range]:focus{outline:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--green) 0 var(--p,0%),#dce7f2 var(--p,0%) 100%)}
input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:#dce7f2}
input[type=range]::-moz-range-progress{height:10px;border-radius:10px;background:var(--green)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#fff;border:4px solid var(--green);box-shadow:0 3px 9px rgba(8,127,104,.33);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--green);box-shadow:0 3px 9px rgba(8,127,104,.33);cursor:grab}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.08)}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);font-weight:700;margin-top:-2px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.quick button{font-size:12px;font-weight:800;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;color:#30455f}
.quick button.on{border-color:var(--green);background:var(--mint);color:var(--green)}
.warn{margin-top:9px;font-size:12.5px;font-weight:700;color:#8e1b30;background:var(--rose);border:1px solid #f3c4cc;border-radius:10px;padding:7px 11px;display:none}
.warn.show{display:block}
/* budget rows */
.bud{display:grid;gap:13px;margin:4px 0 6px}
.brow .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:800;margin-bottom:-2px}
.brow .bh em{font-style:normal;color:var(--mut);font-weight:600;font-size:11.5px}
.brow .bh b{font-size:17px;letter-spacing:-.4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.brow input[type=range]{height:26px}
.budsum{position:sticky;top:0;z-index:3;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;margin:2px 0 14px;box-shadow:0 6px 18px rgba(30,55,84,.1)}
.budsum .l1{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;margin-bottom:7px}
.budsum .l1 span:last-child{font-variant-numeric:tabular-nums}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;background:#eef3f8}
.split i{display:block;height:100%;transition:width .3s}
.split .n{background:#5b8ac5}.split .w{background:#e3b64a}.split .s{background:var(--green)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);font-weight:700;margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* ledger */
.ledger{margin:4px 0 14px;border:1px dashed #c9d6e4;border-radius:15px;padding:13px 15px;background:#fbfdff}
.ledger h3{font-size:11px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.lr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;opacity:0;animation:slide .4s ease forwards}
.lr span:last-child{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.lr.in span:last-child{color:var(--green)}.lr.out span:last-child{color:#4a5d75}
.lr.tot{border-top:1px solid #dbe5ef;margin-top:5px;padding-top:9px;font-weight:900;font-size:15px}
.lr.tot span:last-child{font-size:18px}.lr.neg span:last-child{color:var(--red)}
.lr em{font-style:normal;color:var(--mut);font-weight:600;font-size:11.5px;margin-left:6px}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
/* hero number */
.savedrow{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.savedrow .fig{width:84px;flex:none;max-width:84px}
.big{text-align:center;margin:6px 0 14px}
.big .n{font-size:60px;font-weight:900;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.big .n small{font-size:20px;letter-spacing:-.5px;font-weight:800;margin-left:4px}
.big .c{font-size:13.5px;color:var(--mut);font-weight:700;margin-top:6px}
/* survival months strip */
.months{display:flex;gap:4px;margin:12px 0 8px}
.months i{flex:1;height:30px;border-radius:6px;background:#e6edf4;position:relative;overflow:hidden}
.months i b{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#19b394,#0b7f68);transition:width .5s ease;display:block}
.months i.m-low b{background:linear-gradient(180deg,#f0788a,#c24154)}
.months i.m-mid b{background:linear-gradient(180deg,#f0c257,#d69b18)}
.mlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);font-weight:800;letter-spacing:.3px}
/* result blocks */
.verdict{display:flex;gap:14px;align-items:flex-end;background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:26px 16px 16px;margin-bottom:12px}
.verdict .fig{width:104px;flex:none;max-width:104px;cursor:pointer}
.verdict .vtext{flex:1;min-width:0;padding-bottom:10px}
.replay{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;font-weight:800;color:var(--green);background:var(--mint);border:1px solid #bfe6da;border-radius:999px;padding:4px 10px}
.verdict .vt{font-size:17px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.verdict .vs{font-size:13.5px;color:var(--mut);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.mini{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.mini .l{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.mini .v{font-size:20px;font-weight:900;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
.mini .s{font-size:11.5px;color:var(--mut)}
.pos{color:var(--green)}.neg{color:var(--red)}
.ins{display:grid;gap:8px;margin:4px 0 14px}
.ins div{background:#f8fafc;border-left:4px solid var(--gold);border-radius:10px;padding:10px 13px;font-size:14px;color:#33485f}
.ins div.g{border-color:var(--green)}.ins div.r{border-color:var(--red)}
.tip{display:flex;gap:10px;background:var(--amber);border:1px solid #f0d99b;border-radius:13px;padding:11px 13px;font-size:13.5px;color:#6c5012;margin-bottom:12px}
.tip span:first-child{font-size:18px;line-height:1.2}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:5px 12px;border:1px solid var(--line);background:#f5f8fb;color:#8a9aae}
.badge.on{color:#5a3b00;background:linear-gradient(180deg,#ffe9a8,#f6c445);border-color:#e2a91c}
.fine{font-size:10.5px;color:#718198;text-align:center;margin-top:12px;line-height:1.4}
.scorerow{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.scorerow .sb{flex:1;min-width:0}
.ring{position:relative;width:118px;height:118px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:32px;font-weight:900;letter-spacing:-1px}
.ring .n small{display:block;font-size:9.5px;letter-spacing:.6px;color:var(--mut);font-weight:800;margin-top:-5px}
.whatif{background:linear-gradient(140deg,#0d2a4a,#0a1f3a);border-radius:18px;padding:16px 17px;margin:4px 0 14px;color:#eaf2ff}
.whatif h3{font-size:15px;font-weight:900;letter-spacing:-.3px;margin-bottom:3px}
.whatif p{font-size:12.5px;color:#a7bdd8;margin-bottom:11px}
.whatif .amt b{color:#fff}.whatif .amt .of{color:#9fd8c6}
.whatif .ends{color:#8ba4c2}
.whatif input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,#2ad0a8 0 var(--p,0%),rgba(255,255,255,.18) var(--p,0%) 100%)}
.whatif input[type=range]::-webkit-slider-thumb{border-color:#2ad0a8;background:#07263f}
.whatif input[type=range]::-moz-range-thumb{border-color:#2ad0a8;background:#07263f}
.wres{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 13px;font-size:14px;margin-top:10px}
.wres b{color:#5ce0bb;font-size:17px}
.fx{position:fixed;pointer-events:none;font-size:22px;z-index:9;animation:fly 1.3s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.tools-h{margin:20px 2px 9px;font-size:16px;font-weight:900;letter-spacing:-.2px}
.tools-h small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tool{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:15px;padding:11px;text-decoration:none;transition:box-shadow .15s;min-width:0;box-shadow:0 4px 14px rgba(30,55,84,.05)}
.tool .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#e6f0fb}
.tool b{display:block;font-size:13px;line-height:1.15}
.tool small{display:block;font-size:11px;color:var(--mut);line-height:1.25;margin-top:2px}
.tool:hover{box-shadow:0 0 0 3px rgba(8,127,104,.25)}
@media (max-width:560px){.scorerow{flex-direction:column;gap:10px}.scorerow .sb{width:100%}.badges{justify-content:center}}
@media (max-width:480px){.wrap{padding:12px 12px 22px}.brand{font-size:22px}h2{font-size:20px}.card{padding:16px;border-radius:18px}.tools{grid-template-columns:1fr}.big .n{font-size:48px}.grid2{grid-template-columns:1fr}.months i{height:26px}.amt b{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lr{opacity:1}}
/* ============ CHARACTER RIG ============ */
.fig{width:100%;max-width:150px;margin:0 auto}
.fig svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 14px rgba(20,40,70,.18))}
.fig svg g{transform-box:view-box}
.mq-armL{transform-origin:57px 99px}
.mq-armR{transform-origin:103px 99px}
.mq-legL{transform-origin:69px 150px}
.mq-legR{transform-origin:91px 150px}
.mq-head{transform-origin:80px 88px}
.mq-body{transform-origin:80px 150px}
.mq-sh{transform-origin:80px 250px;transform-box:view-box}
.fig svg>g,.fig svg>ellipse{will-change:transform}

/* ---- idle: breathing, tiny arm sway ---- */
@keyframes idleBody{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.012)}}
@keyframes idleArmL{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-4deg)}}
@keyframes idleArmR{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(4deg)}}
@keyframes idleHead{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-1.4deg) translateY(-1.5px)}}
.p-idle .mq-body,.p-think .mq-body{animation:idleBody 3.6s ease-in-out infinite}
.p-idle .mq-head{animation:idleHead 3.6s ease-in-out infinite}
.p-idle .mq-armL{animation:idleArmL 3.6s ease-in-out infinite}
.p-idle .mq-armR{animation:idleArmR 3.6s ease-in-out infinite}

/* ---- think / gesture: one hand raised to the side ---- */
/* ---- thumbs up: hide the hanging arm, show the dedicated one ---- */
.mq-tu{display:none}
.p-thumbsup .mq-tu{display:block}
.p-thumbsup .mq-armL{display:none}
.p-thumbsup .mq-phone{opacity:0}
@keyframes tuPop{0%{transform:translateY(16px) scale(.86);opacity:0}
  55%{transform:translateY(-4px) scale(1.06);opacity:1}
  75%{transform:translateY(1px) scale(.98)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes tuNod{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tuHead{0%{transform:rotate(0)}40%{transform:rotate(-6deg)}100%{transform:rotate(-3deg)}}
.p-thumbsup .mq-tu{animation:tuPop .55s cubic-bezier(.3,1.4,.5,1) .1s both,tuNod 2.4s ease-in-out .7s infinite}
.p-thumbsup .mq-body{animation:idleBody 3s ease-in-out infinite}
.p-thumbsup .mq-head{animation:tuHead .55s ease .1s both}
.p-thumbsup .mq-armR{animation:idleArmR 3s ease-in-out infinite}

.p-think .mq-armL{transform:rotate(104deg)}
.p-think .mq-head{transform:rotate(-6deg)}
.p-think .mq-armR{animation:idleArmR 3.6s ease-in-out infinite}

/* ---- walk ---- */
@keyframes wLegL{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes wLegR{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes wArmL{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(18deg)}}
@keyframes wArmR{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-18deg)}}
@keyframes wBody{0%,100%{transform:translateY(0) rotate(-1deg)}25%{transform:translateY(-4px) rotate(.5deg)}50%{transform:translateY(0) rotate(1deg)}75%{transform:translateY(-4px) rotate(-.5deg)}}
@keyframes wHead{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-3px) rotate(-1deg)}}
@keyframes wShadow{0%,100%{transform:scaleX(1);opacity:.75}50%{transform:scaleX(.86);opacity:.55}}
.p-walk .mq-legL{animation:wLegL 1s ease-in-out infinite}
.p-walk .mq-legR{animation:wLegR 1s ease-in-out infinite}
.p-walk .mq-armL{animation:wArmL 1s ease-in-out infinite}
.p-walk .mq-armR{animation:wArmR 1s ease-in-out infinite}
.p-walk .mq-body{animation:wBody 1s ease-in-out infinite}
.p-walk .mq-head{animation:wHead 1s ease-in-out infinite}
.p-walk .mq-sh{animation:wShadow 1s ease-in-out infinite}
.p-walk .mq-phone{opacity:0}

/* ---- run: big stride, forward lean, arms pumping beside the body ---- */
@keyframes rLegL{0%,100%{transform:rotate(40deg)}50%{transform:rotate(-42deg)}}
@keyframes rLegR{0%,100%{transform:rotate(-42deg)}50%{transform:rotate(40deg)}}
@keyframes rArmL{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-14deg)}}
@keyframes rArmR{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(14deg)}}
@keyframes rBody{0%,100%{transform:translateY(-2px) rotate(-8deg)}50%{transform:translateY(-9px) rotate(-6deg)}}
@keyframes rShadow{0%,100%{transform:scaleX(.8);opacity:.5}50%{transform:scaleX(.6);opacity:.3}}
.p-run .mq-legL{animation:rLegL .46s ease-in-out infinite}
.p-run .mq-legR{animation:rLegR .46s ease-in-out infinite}
.p-run .mq-armL{animation:rArmL .46s ease-in-out infinite}
.p-run .mq-armR{animation:rArmR .46s ease-in-out infinite}
.p-run .mq-body{animation:rBody .46s ease-in-out infinite}
.p-run .mq-head{transform:rotate(-6deg)}
.p-run .mq-sh{animation:rShadow .46s ease-in-out infinite}
.p-run .mq-phone,.p-run .mq-bag{opacity:0}

/* ---- cheer: the big one. Leap, both arms thrown up in a V, shouting ---- */
@keyframes cJump{0%{transform:translateY(0) scaleY(.9) scaleX(1.06)}
  14%{transform:translateY(-30px) scaleY(1.07) scaleX(.95)}
  34%{transform:translateY(-36px) scaleY(1.02) scaleX(.99)}
  52%{transform:translateY(0) scaleY(.92) scaleX(1.05)}
  66%{transform:translateY(-14px) scaleY(1.03) scaleX(.98)}
  80%{transform:translateY(0) scaleY(.95) scaleX(1.03)}
  100%{transform:translateY(-4px) scaleY(1) scaleX(1)}}
@keyframes cArmL{0%{transform:rotate(14deg)}18%{transform:rotate(152deg)}
  40%{transform:rotate(132deg)}60%{transform:rotate(150deg)}100%{transform:rotate(140deg)}}
@keyframes cArmR{0%{transform:rotate(-14deg)}18%{transform:rotate(-152deg)}
  40%{transform:rotate(-132deg)}60%{transform:rotate(-150deg)}100%{transform:rotate(-140deg)}}
@keyframes cLegL{0%{transform:rotate(0)}18%{transform:rotate(-26deg)}45%{transform:rotate(6deg)}100%{transform:rotate(-7deg)}}
@keyframes cLegR{0%{transform:rotate(0)}18%{transform:rotate(26deg)}45%{transform:rotate(-6deg)}100%{transform:rotate(8deg)}}
@keyframes cHead{0%{transform:rotate(0)}20%{transform:rotate(-9deg) translateY(-3px)}60%{transform:rotate(3deg)}100%{transform:rotate(-4deg)}}
@keyframes cShadow{0%{transform:scaleX(1);opacity:.75}25%{transform:scaleX(.5);opacity:.22}55%{transform:scaleX(1.02);opacity:.72}100%{transform:scaleX(.9);opacity:.6}}
.p-cheer .mq-body{animation:cJump 1.15s cubic-bezier(.3,.9,.4,1) .15s both,cFloat 2.6s ease-in-out 1.3s infinite}

  if(!o.compact)h+='<div class="ends"><span>'+(o.minLab||fmt(min))+'</span><span>'+(o.maxLab||fmt(max))+'</span></div>';
  if(o.quick&&o.quick.length){h+='<div class="quick" data-for="'+id+'">';o.quick.forEach(function(q){h+='<button type="button" data-v="'+q[1]+'">'+q[0]+'</button>'});h+='</div>'}

/* ---------- state ---------- */
var D={sal:100000,rent:26000,food:13000,bills:8000,emi:0,fam:0,life:12000,misc:5000,
       bank:50000,ef:120000,inv:0,debt:0,save:0,cover:'no'};
var EXP=[
 ['rent','🏠 Rent / home loan','Flat + maintenance',.70],
 ['food','🍲 Food & groceries','Cooking, eating out, delivery',.40],
 ['bills','💡 Bills & commute','Phone, power, internet, travel',.30],
 ['emi','🏦 Loan EMIs','Car, personal loan, gadgets',.50],
 ['fam','👪 Family support','Sent home every month',.50],
 ['life','🎬 Lifestyle','Outings, shopping, subscriptions',.40],
 ['misc','🧾 Other & miscellaneous','Medical, repairs, gifts, anything else',.35]
];
function spendAll(){var t=0;EXP.forEach(function(e){t+=D[e[0]]});return t}
/* what you truly cannot avoid if the salary stops */
function leanSpend(){return Math.round(D.rent+D.bills+D.emi+D.fam+D.food*.8+D.misc*.5+(D.debt>0?D.debt*.05:0))}
function surplus(){return D.sal-spendAll()}
function cashNow(){return D.bank+D.ef}
function survivalLean(){return cashNow()/Math.max(1,leanSpend())}
function survivalFull(){return cashNow()/Math.max(1,spendAll()+(D.debt>0?D.debt*.05:0))}
function survivalAll(){return (cashNow()+D.inv)/Math.max(1,leanSpend())}
function saveRate(){return D.sal>0?D.save/D.sal:0}
function score(){
  var a=clamp(survivalLean()/6,0,1)*45;
  var b=clamp(saveRate()/.2,0,1)*25;
  var c=20*clamp(1-D.debt/Math.max(1,D.sal*1.5),0,1);
  var d=D.cover==='yes'?10:0;
  return Math.round(clamp(a+b+c+d,0,100));
}

/* ---------- shared bits ---------- */
function steps(n){var h='';for(var i=0;i<3;i++)h+='<div class="'+(i<=n?'on':'')+'"></div>';$('#steps').innerHTML=h}
function me(mood,cls){return figure(mood==='happy'?'walk':'idle',mood)}
function postH(){try{parent.postMessage({type:'mq-height',h:document.documentElement.scrollHeight},'*')}catch(e){}}
function toTop(){window.scrollTo(0,0);try{parent.postMessage({type:'mq-top'},'*')}catch(e){}}
function stage(h){$('#stage').innerHTML=h;paintAll($('#stage'));setTimeout(postH,60);setTimeout(postH,650);toTop()}
function renderTools(){
  var h='';TOOLS.forEach(function(t){
    h+='<a class="tool" href="'+t.href+'" target="_top"><span class="ic">'+t.ic+'</span><span><b>'+t.name+'</b><small>'+t.desc+'</small></span></a>'});
  $('#tools').innerHTML=h;
}
function burst(list){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(var i=0;i<10;i++){var s=document.createElement('span');s.className='fx';s.textContent=list[i%list.length];
    s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight/3)+'px';
    s.style.setProperty('--dx',(Math.random()*220-110)+'px');s.style.setProperty('--dy',(-50-Math.random()*110)+'px');
    s.style.animationDelay=(i*45)+'ms';document.body.appendChild(s);setTimeout(function(e){e.remove()}.bind(null,s),1700)}
}

/* ---------- screen 1: your month ---------- */
function budRefresh(){
  var sp=0;EXP.forEach(function(e){sp+=slVal('e_'+e[0])});
  var sal=slVal('m_sal'),left=sal-sp;
  var needs=slVal('e_rent')+slVal('e_bills')+slVal('e_emi')+slVal('e_fam'),
      wants=slVal('e_food')+slVal('e_life')+slVal('e_misc');
  var el=$('#budLeft');if(!el)return;
  el.innerHTML='<span>Left over every month</span><span style="color:'+(left<0?'var(--red)':'var(--green)')+'">'+(left<0?'−':'')+full(Math.abs(left))+'</span>';
  var tot=Math.max(sal,sp)||1;
  $('#spN').style.width=(needs/tot*100)+'%';$('#spW').style.width=(wants/tot*100)+'%';$('#spS').style.width=(Math.max(0,left)/tot*100)+'%';
  var w=$('#budWarn');
  var msg=left<0?'You are spending '+full(-left)+' more than you earn. That gap goes on a card every month.':(sp<=0?'Add at least one expense — rent, food or bills. Nobody lives on zero.':'');
  w.textContent=msg;w.classList.toggle('show',!!msg);
}
function screen1(){
  steps(0);renderTools();
  var rows='';
  EXP.forEach(function(e){
    var k=e[0],mx=Math.max(20000,r500(D.sal*e[3]));
    var q=k==='misc'?[['₹5,000',5000],['₹10,000',10000],['₹20,000',20000]]:(k==='emi'||k==='fam'?[['None',0]]:null);
    rows+='<div class="brow"><div class="bh"><span>'+e[1]+' <em>'+e[2]+'</em></span><b id="e_'+k+'_v"></b></div>'+
      sliderHTML('e_'+k,0,mx,1000,clamp(D[k],0,mx),{cb:budRefresh,compact:true,quick:q,aria:e[1]})+'</div>';
  });
  stage('<div class="card"><span class="tag gold">Step 1 of 3 · Your month</span>'+
   '<h2>Let\'s look at one month of your money</h2>'+
   '<div class="intro">'+figure('walk','happy')+'<div class="bubble">Hi, I am <b>'+NAME+'</b>. Just one month — what comes in, what goes out. Then I will ask you <b>the one question nobody likes to think about</b>.</div></div>'+
   '<div class="ask" style="margin-top:14px"><div class="q1">💼 Monthly in-hand salary</div><div class="h1">What actually lands in your bank, after tax and PF.</div>'+
     sliderHTML('m_sal',15000,500000,2500,D.sal,{minLab:'₹15K',maxLab:'₹5 L',
       quick:[['₹50K',50000],['₹1 L',100000],['₹1.5 L',150000],['₹2 L',200000]],
       cb:function(v){D.sal=v;setOf('m_sal',full(v*12)+' a year');budRefresh()}})+'</div>'+
   '<div class="lbl">Where it goes every month</div>'+
   '<div class="budsum"><div class="l1" id="budLeft"></div>'+
     '<div class="split"><i class="n" id="spN"></i><i class="w" id="spW"></i><i class="s" id="spS"></i></div>'+
     '<div class="legend"><span><i class="n" style="background:#5b8ac5"></i>Must-pay</span><span><i class="w" style="background:#e3b64a"></i>Living &amp; lifestyle</span><span><i class="s" style="background:var(--green)"></i>Left over</span></div>'+
     '<div class="warn" id="budWarn"></div></div>'+
   '<div class="bud">'+rows+'</div>'+
   '<button class="btn" id="n1">Next: what have you saved? →</button></div>');
  budRefresh();
  $('#n1').onclick=function(){
    D.sal=slVal('m_sal');EXP.forEach(function(e){D[e[0]]=slVal('e_'+e[0])});
    if(spendAll()<=0){var w=$('#budWarn');w.textContent='Add at least one expense — rent, food or bills. Nobody lives on zero.';w.classList.add('show');
      var bs=$('.budsum');if(bs)bs.scrollIntoView({block:'center',behavior:'smooth'});return}
    screen2()};
}

/* ---------- screen 2: what you have ---------- */
function screen2(){
  steps(1);
  var sp=spendAll(),lean=leanSpend(),sur=Math.max(0,surplus());
  function pos(){
    var c=slVal('p_bank')+slVal('p_ef');
    var m=c/Math.max(1,lean);
    var el=$('#posLine');if(el)el.innerHTML='Right now your cash would cover about <b>'+mo(m)+' months</b> of unavoidable bills.';
    setOf('p_ef',m>=6?'6+ months ✓':m>=3?'getting there':'thin');
  }
  stage('<div class="card"><span class="tag gold">Step 2 of 3 · What you already have</span>'+
   '<h2>Your savings today</h2>'+
   '<p class="txt">Be honest — this is the part that decides everything on the next screen. Nothing you type here is saved or sent anywhere.</p>'+
   '<div class="ask"><div class="q1">💳 Money in the bank</div><div class="h1">Current and savings account balance right now.</div>'+
     sliderHTML('p_bank',0,Math.max(200000,r500(D.sal*6)),5000,clamp(D.bank,0,Math.max(200000,r500(D.sal*6))),{cb:pos,minLab:'₹0'})+'</div>'+
   '<div class="ask"><div class="q1">🛟 Emergency fund</div><div class="h1">Money kept aside only for emergencies — FD, sweep account, separate savings.</div>'+
     sliderHTML('p_ef',0,Math.max(600000,r500(D.sal*12)),5000,clamp(D.ef,0,Math.max(600000,r500(D.sal*12))),{cb:pos,minLab:'₹0',
       quick:[['None',0],['3 months',r500(lean*3)],['6 months',r500(lean*6)]]})+'</div>'+
   '<div class="ask"><div class="q1">📈 Investments you could sell</div><div class="h1">Mutual funds, SIP corpus, stocks, gold. Not PF or locked-in plans.</div>'+
     sliderHTML('p_inv',0,Math.max(1000000,r500(D.sal*24)),5000,clamp(D.inv,0,Math.max(1000000,r500(D.sal*24))),{minLab:'₹0'})+'</div>'+
   '<div class="ask"><div class="q1">💳 Credit card / loan outstanding</div><div class="h1">What you owe today. Card debt costs about 42% a year.</div>'+
     sliderHTML('p_debt',0,Math.max(200000,r500(D.sal*6)),5000,clamp(D.debt,0,Math.max(200000,r500(D.sal*6))),{cb:pos,minLab:'₹0',quick:[['None',0]]})+'</div>'+
   '<div class="ask"><div class="q1">🏦 How much do you actually save each month?</div><div class="h1">You have '+full(sur)+' left over. Be realistic about how much really gets saved.</div>'+
     sliderHTML('p_save',0,Math.max(1000,r500(Math.max(sur,D.sal*.3))),1000,clamp(D.save||r500(sur*.5),0,Math.max(1000,r500(Math.max(sur,D.sal*.3)))),{minLab:'₹0',
       cb:function(v){setOf('p_save',D.sal?Math.round(v/D.sal*100)+'% of salary':'')}})+'</div>'+
   '<div class="lbl">Do you have health insurance of your own?</div>'+
   '<div class="opts" id="cov"><button data-v="yes" class="'+(D.cover==='yes'?'on':'')+'">Yes<small>A personal policy</small></button>'+
     '<button data-v="no" class="'+(D.cover==='no'?'on':'')+'">No / only company cover<small>Ends with the job</small></button></div>'+
   '<div class="tip" style="margin-top:14px"><span>📍</span><span id="posLine"></span></div>'+
   '<button class="btn" id="n2">See my month →</button>'+
   '<button class="btn ghost" id="bk2">← Back</button></div>');
  pos();
  $('#cov').onclick=function(e){var b=e.target.closest('button');if(!b)return;D.cover=b.dataset.v;
    [].forEach.call($('#cov').children,function(x){x.classList.toggle('on',x===b)})};
  $('#n2').onclick=function(){
    D.bank=slVal('p_bank');D.ef=slVal('p_ef');D.inv=slVal('p_inv');D.debt=slVal('p_debt');D.save=slVal('p_save');
    screen3()};
  $('#bk2').onclick=screen1;
}

/* ---------- screen 3: your month, played out ---------- */
function screen3(){
  steps(2);
  var sp=spendAll(),left=D.sal-sp,i=0,rows='';
  function row(c,l,v,em){
    var sign=c==='in'?'+':(c.indexOf('tot')===0?(v<0?'−':''):(v?'−':''));
    return '<div class="lr '+c+'" style="animation-delay:'+(i++*130)+'ms"><span>'+l+(em?'<em>'+em+'</em>':'')+'</span><span>'+sign+full(Math.abs(v))+'</span></div>'}
  rows+=row('in','Salary credited',D.sal);
  EXP.forEach(function(e){if(D[e[0]]>0)rows+=row('out',e[1],D[e[0]])});
  rows+=row('tot'+(left<0?' neg':''),left<0?'Spent more than you earned':'Left over',left);
  if(D.save>0)rows+=row('out','Actually saved',D.save,D.save>=left?'everything left':'the rest gets spent');
  var pct=D.sal?Math.round(D.save/D.sal*100):0;
  stage('<div class="card"><span class="tag">Your month</span>'+
   '<h2>This is one month of your life</h2>'+
   '<div class="ledger"><h3>💸 Payday &amp; bills</h3>'+rows+'</div>'+
   '<div class="savedrow">'+figure(pct>=20?'thumbsup':(D.save>0?'walk':'slump'),pct>=20?'cheer':(D.save>0?'happy':'worried'))+
     '<div class="big" style="margin:0;flex:1"><div class="n">'+full(D.save)+'</div><div class="c">saved this month · '+pct+'% of your salary</div></div></div>'+
   '<div class="grid2">'+
     '<div class="mini"><div class="l">Money in &amp; out</div><div class="v">'+fmt(D.sal)+' <span style="font-size:13px;color:var(--mut)">in</span></div><div class="s">'+fmt(sp)+' went out</div></div>'+
     '<div class="mini"><div class="l">Over a year</div><div class="v '+(D.save>0?'pos':'neg')+'">'+fmt(D.save*12)+'</div><div class="s">if every month looks like this</div></div>'+
   '</div>'+
   '<div class="tip"><span>💭</span><span>That is the easy part. Now the question most people never ask themselves.</span></div>'+
   '<button class="btn" id="n3">😨 What if you lose your job tomorrow? →</button>'+
   '<button class="btn ghost" id="bk3">← Change my numbers</button></div>');
  $('#n3').onclick=screen4;
  $('#bk3').onclick=screen2;
}

/* ---------- screen 4: the survival test ---------- */
function monthsStrip(months,id){
  var h='<div class="months" id="'+id+'">';
  for(var i=0;i<12;i++)h+='<i><b></b></i>';
  return h+'</div><div class="mlab"><span>1 month</span><span>6 months — the target</span><span>12+</span></div>';
}
function fillStrip(id,months){
  var el=$('#'+id);if(!el)return;
  var cls=months>=6?'':months>=3?'m-mid':'m-low';
  [].forEach.call(el.children,function(c,i){
    c.className=cls;
    var f=clamp(months-i,0,1)*100;
    setTimeout(function(){c.firstChild.style.width=f+'%'},60+i*55);
  });
}
function screen4(){
  steps(2);
  var lean=leanSpend(),sFull=survivalFull(),sLean=survivalLean(),sAll=survivalAll();
  var sc=score(),nm=NAME;
  var RE=reactFor(sLean),POSE=RE[0];
  var verdict=sLean>=6?'You could ride this out':sLean>=3?'You would be okay for a while':sLean>=1.5?'It would get tight, fast':sLean>=.5?'You are one month from trouble':'You would be in trouble immediately';
  var vsub=sLean>=6?'A full safety net. This is where everyone should be.':sLean>=3?'Halfway to a full safety net. Keep going.':sLean>=1.5?'Most job searches take 2 to 4 months. You would run out first.':'There is almost nothing between you and a credit card.';
  var target=Math.round(lean*6),gap=Math.max(0,target-cashNow());
  var ins=[];
  if(gap>0)ins.push({s:9,c:'r',t:'🎯 A 6-month safety net for you is <b>'+full(target)+'</b>. You are <b>'+full(gap)+'</b> short.'});
  else ins.push({s:1,c:'g',t:'🎯 You already hold more than a 6-month safety net ('+full(target)+'). Anything beyond this belongs in investments, not a savings account.'});
  if(D.debt>0)ins.push({s:10,c:'r',t:'💳 Your <b>'+fmt(D.debt)+'</b> card or loan balance costs roughly <b>'+fmt(D.debt*.42)+' a year</b> in interest. Clearing it beats any investment you can buy.'});
  if(D.cover==='no')ins.push({s:8,c:'r',t:'🛡️ No personal health cover. Company cover ends on your last working day — exactly when you can least afford a hospital bill.'});
  else ins.push({s:2,c:'g',t:'🛡️ You hold your own health policy, so a hospital bill will not wipe out this safety net.'});
  if(D.life+D.misc>D.sal*.25)ins.push({s:6,c:'',t:'🎬 Lifestyle and miscellaneous add up to <b>'+fmt(D.life+D.misc)+' a month</b> ('+Math.round((D.life+D.misc)/D.sal*100)+'% of salary). Cutting this is the fastest lever you control.'});
  if(D.emi>D.sal*.2)ins.push({s:7,c:'r',t:'🏦 EMIs take <b>'+Math.round(D.emi/D.sal*100)+'%</b> of your salary and do not stop when your income does.'});
  if(saveRate()<.1)ins.push({s:7,c:'r',t:'🏦 You save '+Math.round(saveRate()*100)+'% of your salary. Most planners suggest at least 20% once your bills are covered.'});
  else if(saveRate()>=.2)ins.push({s:2,c:'g',t:'🏦 You save '+Math.round(saveRate()*100)+'% of your salary — that one habit does most of the work.'});
  if(D.inv>0)ins.push({s:4,c:'',t:'📈 Selling investments would stretch you to <b>'+mo(sAll)+' months</b> — but you would be selling in a hurry, possibly at a loss, and may owe capital gains tax.'});
  ins.sort(function(a,b){return b.s-a.s});ins=ins.slice(0,4);
  var B=[{n:'Survivor',e:'🛟',on:sLean>=3},{n:'Safety Net',e:'🏆',on:sLean>=6},
   {n:'Debt-Free',e:'💳',on:D.debt<=0},{n:'Big Saver',e:'🏦',on:saveRate()>=.2},{n:'Protected',e:'🛡️',on:D.cover==='yes'}];
  var bh='';B.forEach(function(b){bh+='<span class="badge '+(b.on?'on':'')+'">'+(b.on?b.e:'🔒')+' '+b.n+'</span>'});
  var ih='';ins.forEach(function(x){ih+='<div class="'+x.c+'">'+x.t+'</div>'});
  var circ=2*Math.PI*48,off=circ*(1-sc/100);
  var mxSave=Math.max(2000,r500(Math.max(Math.max(0,surplus()),D.sal*.4)));
  stage('<div class="card"><span class="tag red">The job-loss test</span>'+
   '<h2>😨 Your salary stops today</h2>'+
   '<p class="txt">No notice, no severance. Rent, EMIs and family support do not stop. You cut lifestyle to zero and live lean on <b>'+full(lean)+' a month</b>.</p>'+
   '<div class="big"><div class="n" id="bigM">0<small> months</small></div><div class="c">is how long '+nm+' could survive on cash</div></div>'+
   monthsStrip(sLean,'strip')+
   '<div class="verdict" style="margin-top:14px" id="vbox">'+figure(POSE,RE[1])+'<div class="vtext"><div class="vt">'+verdict+'</div><div class="vs">'+vsub+'</div><button class="replay" id="replay" type="button">▶ Watch again</button></div></div>'+
   '<div class="grid2">'+
     '<div class="mini"><div class="l">If you changed nothing</div><div class="v">'+mo(sFull)+' mo</div><div class="s">same lifestyle, '+fmt(spendAll())+'/mo</div></div>'+
     '<div class="mini"><div class="l">If you also sold investments</div><div class="v">'+mo(sAll)+' mo</div><div class="s">'+(D.inv>0?'living lean':'nothing to sell')+'</div></div>'+
   '</div>'+
   '<div class="ins">'+ih+'</div>'+
   '<div class="whatif"><h3>🎮 Play with it</h3><p>Move the slider and watch how fast you could build a full 6-month safety net.</p>'+
     sliderHTML('w_save',0,mxSave,1000,clamp(D.save,0,mxSave),{minLab:'₹0',aria:'monthly saving',
       quick:[['Half of what\'s left',r500(Math.max(0,surplus())/2)],['All of it',r500(Math.max(0,surplus()))]],
       cb:function(v){
         var need=Math.max(0,Math.round(lean*6)-cashNow()),el=$('#wres');if(!el)return;
         if(need<=0){el.innerHTML='✅ You already have a full 6-month safety net. Put new savings into investments instead.';return}
         if(v<=0){el.innerHTML='At <b>₹0</b> a month you never get there. Even '+full(Math.round(lean*.1/500)*500||500)+' a month starts the clock.';return}
         var n=Math.ceil(need/v),d=new Date();d.setMonth(d.getMonth()+n);
         var lab=n>24?'<b>'+(Math.round(n/12*10)/10)+' years</b>':'<b>'+n+' month'+(n>1?'s':'')+'</b>';
         el.innerHTML='Saving '+full(v)+' a month, you reach a full 6-month safety net in '+lab+' — around '+d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'.';
       }})+
     '<div class="wres" id="wres"></div></div>'+
   '<div class="scorerow">'+
     '<div class="ring"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="#e3ebf3" stroke-width="9"/>'+
     '<circle cx="55" cy="55" r="48" fill="none" stroke="'+(sc>=70?'#0d9b7d':sc>=50?'#d69b18':'#c24154')+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="rg" style="transition:stroke-dashoffset 1.1s ease"/></svg>'+
     '<div class="n"><div>'+sc+'<small>OUT OF 100</small></div></div></div>'+
     '<div class="sb"><div class="badges">'+bh+'</div></div></div>'+
   '<a class="btn" href="financial-health.html" target="_top">Get my full financial health report →</a>'+
   '<button class="btn ghost" id="again">↻ Try different numbers</button>'+
   '<div class="fine">An illustrative simulation, not financial advice. It assumes you cut lifestyle to zero, keep paying rent, EMIs and family support, and that investments can be sold quickly. Nothing you enter is stored.</div></div>');
  /* animate */
  var t0=performance.now(),el=$('#bigM');
  (function st(t){var p=Math.min(1,(t-t0)/1100),v=sLean*(1-Math.pow(1-p,3));
    el.innerHTML=mo(v)+'<small> months</small>';
    el.style.color=v>=6?'var(--green)':v>=3?'var(--gold)':'var(--red)';
    if(p<1)requestAnimationFrame(st)})(t0);
  fillStrip('strip',sLean);
  setTimeout(function(){var g=$('#rg');if(g)g.style.strokeDashoffset=off},80);
  if(sLean>=6)burst(['🎉','✨','🛟','⭐']);
  function replay(){var f=$('#vbox .fig');if(!f)return;var c=f.className;f.className='fig';void f.offsetWidth;f.className=c;
    if(POSE==='cheer')burst(['🎉','✨','🏆','⭐'])}
  $('#replay').onclick=replay;
  $('#vbox .fig').onclick=replay;
  $('#again').onclick=function(){screen1()};
}

renderTools();
screen1();
window.addEventListener('resize',postH);
})();
</script>
